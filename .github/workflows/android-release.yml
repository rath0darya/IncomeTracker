name: Android Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: anon-tracker-release
  cancel-in-progress: false
jobs:
  build-sign-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore persistent signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "KEYSTORE_BASE64 secret is required"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/anon-tracker.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/anon-tracker.jks" >> "$GITHUB_ENV"
      - name: Build signed release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle --no-daemon :app:assembleRelease
          jarsigner -verify app/build/outputs/apk/release/app-release.apk
      - name: Publish APK and source archives
        run: |
          VERSION=$(grep 'versionName' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          TAG="v$VERSION"
          git archive --format=zip --output="AnonTracker-$VERSION-source.zip" HEAD
          git archive --format=tar.gz --output="AnonTracker-$VERSION-source.tar.gz" HEAD
          gh release delete "$TAG" --yes || true
          gh release create "$TAG" app/build/outputs/apk/release/app-release.apk "AnonTracker-$VERSION-source.zip" "AnonTracker-$VERSION-source.tar.gz" --title "Anon Tracker $VERSION" --notes "Signed release. Same persistent keystore is required for in-place upgrades."
        env:
          GH_TOKEN: ${{ github.token }}
