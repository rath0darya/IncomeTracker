name: Android Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: anon-tracker-release
  cancel-in-progress: false
jobs:
  build-sign-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build signed APK without repository secrets
        run: |
          gradle --no-daemon :app:assembleRelease
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
      - name: Publish APK and source archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep 'versionName' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          TAG="v$VERSION"
          git archive --format=zip --output="AnonTracker-$VERSION-source.zip" HEAD
          git archive --format=tar.gz --output="AnonTracker-$VERSION-source.tar.gz" HEAD
          gh release delete "$TAG" --yes || true
          gh release create "$TAG" app/build/outputs/apk/release/app-release.apk "AnonTracker-$VERSION-source.zip" "AnonTracker-$VERSION-source.tar.gz" --title "Anon Tracker $VERSION" --notes "Signed APK built with the Android debug signing identity generated on this GitHub runner. No repository signing secrets are required. Reinstall may be required for future builds because runner signing identities are not persistent."
